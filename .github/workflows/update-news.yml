name: Refresh Study Centre news

on:
  schedule:
    # Several morning attempts, since GitHub may delay or omit individual runs.
    - cron: '7,27,47 5-8 * * 1-5'
    - cron: '17 10,12,15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch mixed-source headlines
        run: python3 scripts/update_news.py
      - name: Save headlines
        id: save
        run: |
          if git diff --quiet -- news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Refresh Study Centre headlines"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the refreshed headlines
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
